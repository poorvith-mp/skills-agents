should_fire:
  - 'build an MCP server in TypeScript exposing our internal database to Claude'
  - 'define MCP tools with strict JSON Schema inputs and descriptive docstrings'
  - 'create MCP resources and dynamic resource templates for contextual file loading'
  - 'handle authentication and API keys securely within an MCP server implementation'
  - 'debug why an AI client fails to discover or call tools on our MCP server'
  - 'build an MCP server in Python to connect an agent to our local file system'
  - 'implement standard error handling and rate limit responses in an MCP tool handler'
  - 'publish and test an MCP server using the MCP Inspector debugging tool'
should_not_fire:
  - prompt: 'connect agents to 200+ pre-built SaaS integrations via Composio'
    expect: 'composio'
  - prompt: 'design REST and GraphQL contracts with OpenAPI schemas'
    expect: 'api-design'
  - prompt: 'build autonomous multi-agent orchestration frameworks'
    expect: 'agent-architecture'
