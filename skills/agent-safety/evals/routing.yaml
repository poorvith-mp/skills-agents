should_fire:
  - 'implement guardrails to protect our autonomous agent from prompt injection attacks'
  - 'sandbox an agent''s code execution environment to prevent unauthorized system access'
  - 'design human-in-the-loop approval gates before an agent executes high-risk actions'
  - 'prevent indirect prompt injection when an agent parses untrusted web pages or emails'
  - 'implement rate limits, tool budget caps, and recursion depth limits on agents'
  - 'audit agent system prompts for jailbreak vulnerabilities and role escape flaws'
  - 'enforce strict output validation and PII redaction on all agent-generated text'
  - 'create an emergency kill-switch to terminate rogue or runaway autonomous agents'
should_not_fire:
  - prompt: 'audit web application source code for traditional OWASP vulnerabilities'
    expect: 'security-review'
  - prompt: 'test prompt variants using automated evaluation benchmarks and rubrics'
    expect: 'llm-evals'
  - prompt: 'architect multi-agent supervisor and delegation patterns'
    expect: 'agent-orchestration'
